name: Collect academic mobility candidates
on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/crawl-state.json
            data/candidates.json
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      - run: python3 -m collegerank crawl --limit 25
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/crawl-state.json
            data/candidates.json
          key: crawl-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-candidates-${{ github.run_id }}
          path: |
            data/candidates.json
            data/crawl-report.json
            data/crawl-state.json
          retention-days: 30
