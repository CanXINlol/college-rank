[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "college-rank"
version = "0.1.0"
description = "An auditable academic mobility graph and weighted PageRank explorer"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
college-rank = "collegerank.cli:main"

[tool.setuptools.packages.find]
include = ["collegerank*"]
